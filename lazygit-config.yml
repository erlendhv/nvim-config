# Copy this file to your lazygit config directory, renamed to config.yml:
#   Linux:  ~/.config/lazygit/config.yml
#   macOS:  ~/Library/Application Support/lazygit/config.yml
# (run `lazygit --print-config-dir` to confirm the exact path for your setup)
keybinding:
  universal:
    prevItem-alt: l
    nextItem-alt: k
    prevBlock-alt: j
    nextBlock-alt: ø

customCommands:
  - key: 'V'
    context: 'files'
    command: 'code --goto {{.SelectedFile.Name}}'
    description: 'Open in VS Code'
